<!doctype html>
<html lang="zh-CN">
<head>

<title>课间 · 课程表 v3</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#1f2937;background:#edf2f9;--panel:#fff;--line:#dce4ef;--muted:#64748b;--primary:#4f6f9f;--primary2:#6f8fbd;--shadow:0 18px 45px rgba(55,76,108,.12)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e5edf9 0,#f5f7fb 38%,#f6f8fb 100%);min-height:100vh}.app-shell{max-width:1500px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.topbar{display:flex;align-items:center;gap:14px;padding:10px 4px}.date-heading{flex:1;display:flex;flex-direction:column}.date-heading strong{font-size:22px}.date-heading span{color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px}.icon-button,.week-button{border:0;background:#fff;border-radius:12px;min-width:42px;height:42px;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(50,70,100,.08)}.icon-button:hover,.week-button:hover{background:#f8fbff}.now-card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:8px 0 14px;box-shadow:0 8px 25px rgba(50,70,100,.06);min-height:54px}.now-card strong{display:block;margin-bottom:3px}.now-card small{color:var(--muted)}.week-controls{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.8);padding:10px 12px;border:1px solid var(--line);border-radius:16px;margin-bottom:14px}.week-controls input[type=range]{flex:1}.week-text-button,.plain-button{border:0;background:transparent;color:var(--primary);font-weight:650;cursor:pointer}.schedule-frame{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.schedule{min-width:980px;display:grid;position:relative;grid-template-rows:46px repeat(12,76px);background:#fff}.grid-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0}.head-cell{font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;background:#f7f9fc;position:sticky;top:0;z-index:6}.head-cell.today{background:var(--primary);color:#fff;box-shadow:inset 0 -3px 0 rgba(255,255,255,.28),0 4px 12px rgba(70,98,133,.18)}.time-cell{font-size:12px;color:var(--muted);text-align:center;background:#fafbfd;display:flex;flex-direction:column;align-items:center;justify-content:center;position:sticky;left:0;z-index:4}.time-cell b{font-size:13px;color:#334155}.course-card{z-index:3;margin:3px 4px;border-radius:12px;padding:8px 9px;color:#fff;overflow:hidden;box-shadow:0 5px 14px rgba(15,23,42,.16);cursor:pointer;align-self:stretch;justify-self:start;min-width:0;border:1px solid rgba(255,255,255,.35)}.course-card.other-week{opacity:.22;filter:saturate(.5)}.course-card .course-name{font-weight:750;font-size:13px;line-height:1.25}.course-card .course-meta{font-size:11px;line-height:1.3;margin-top:4px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.course-card .course-weeks{font-size:10px;margin-top:3px;opacity:.85}.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:20}.board-panel{position:fixed;z-index:21;top:0;left:0;width:min(360px,88vw);height:100vh;background:#fff;box-shadow:20px 0 55px rgba(15,23,42,.18);padding:18px;transform:translateX(-105%);transition:.22s ease;overflow:auto}.board-panel.open{transform:translateX(0)}.panel-heading{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:750;margin-bottom:14px}.board-list{display:grid;gap:8px;margin-bottom:12px}.board-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}.board-item.active{background:#eef4ff;border-color:#9eb4d4}.board-item span{flex:1}.wide-action{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin:5px 0;cursor:pointer;font-weight:650}.wide-action.primary,.primary-button{background:var(--primary);color:#fff;border-color:var(--primary)}.panel-section{margin:18px 0 7px;color:var(--muted);font-size:12px;font-weight:750;text-transform:uppercase}.local-note,.dialog-copy{font-size:12px;color:var(--muted);line-height:1.5}.dialog{border:0;border-radius:18px;box-shadow:0 25px 70px rgba(15,23,42,.22);padding:0;width:min(680px,92vw);max-height:88vh}.small-dialog{width:min(480px,92vw)}.dialog::backdrop{background:rgba(15,23,42,.35)}.dialog form{padding:20px}.dialog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.dialog-header h2{font-size:20px;margin:0}.dialog label{display:grid;gap:6px;font-size:13px;font-weight:650;margin:10px 0}.dialog input,.dialog textarea,.dialog select{width:100%;border:1px solid #ccd6e4;border-radius:10px;padding:9px 10px;font:inherit;background:#fff}.color-input{height:42px;padding:4px!important}.two-columns,.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot-grid{grid-template-columns:1fr 1fr 1fr}.slot-title,.slot-editor-top{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:750}.slot-list{display:grid;gap:10px}.slot-editor{border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.primary-button,.secondary-button{border:0;border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:700}.secondary-button{background:#edf2f7;color:#334155}.switch-row{display:flex!important;align-items:center;justify-content:space-between;gap:14px}.switch-row span{display:grid}.switch-row small{color:var(--muted);font-weight:400}.switch-row input{width:auto}.time-editor{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.time-row{display:grid;grid-template-columns:36px 1fr 1fr;align-items:center;gap:6px}.manager-list{display:grid;gap:8px}.manager-item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}.manager-item .dot{width:12px;height:12px;border-radius:50%}.manager-item .info{flex:1}.manager-item small{display:block;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1e293b;color:#fff;border-radius:12px;padding:10px 14px;z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.app-shell{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.date-heading strong{font-size:18px}.now-card{font-size:13px}.week-text-button{display:none}.two-columns,.slot-grid,.time-editor{grid-template-columns:1fr}.dialog{max-height:92vh}.dialog form{padding:15px}}
@media (display-mode: standalone){body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}.dialog input,.dialog textarea,.dialog select{font-size:16px}.schedule-frame{-webkit-overflow-scrolling:touch}}
</style>
</head>
<body>
<main class="app-shell">
<header class="topbar"><button class="icon-button" id="boardMenuButton" aria-label="切换课表">☰</button><div class="date-heading"><strong id="todayLabel">—</strong><span id="weekLabel">第 1 周</span></div><div class="top-actions"><button class="icon-button" id="jumpToday" title="回到本周">◎</button><button class="icon-button" id="addCourseButton" title="添加课程">＋</button><button class="icon-button" id="settingsButton" title="课表设置">⚙</button></div></header>
<section class="now-card" id="nowCard"></section>
<section class="week-controls"><button id="previousWeek" class="week-button">‹</button><input id="weekRange" type="range" min="1" max="20" value="1"><button id="nextWeek" class="week-button">›</button><button id="changeWeek" class="week-text-button">修改当前周</button></section>
<section class="schedule-frame"><div class="schedule" id="schedule"></div></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="board-panel" id="boardPanel" aria-hidden="true"><div class="panel-heading"><span>我的课表</span><button class="plain-button" id="closePanel">关闭</button></div><div id="boardList" class="board-list"></div><button class="wide-action primary" id="newBoardButton">＋ 新建课表</button><button class="wide-action" id="manageCoursesButton">管理已添加课程</button><div class="panel-section">数据</div><button class="wide-action" id="importHtmlButton">从教务系统 HTML 导入</button><button class="wide-action" id="shareBoardButton">生成同步码</button><button class="wide-action" id="importCodeButton">导入同步码</button><p class="local-note">v3：支持 iPhone 主屏幕网页 App 与离线打开；课程数据仍仅保存在本机。URP 导入继续按每个时段保存周次和地点。</p></aside>
<input type="file" id="htmlFileInput" accept="text/html,.html,.htm" hidden>
<dialog id="courseDialog" class="dialog"><form method="dialog" id="courseForm"><div class="dialog-header"><h2 id="courseDialogTitle">添加课程</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><label>课程名称<input name="name" required maxlength="60"></label><div class="two-columns"><label>教师<input name="teacher" maxlength="40"></label><label>默认地点<input name="location" maxlength="60" placeholder="各时段可单独设置"></label></div><label>课程颜色<input class="color-input" name="color" type="color" value="#6f8fbd"></label><div class="slot-title"><span>上课时间</span><button type="button" class="plain-button" id="addSlotButton">＋ 添加时段</button></div><div id="slotList" class="slot-list"></div><label>备注<textarea name="note" rows="2" maxlength="160"></textarea></label><div class="dialog-actions"><button value="cancel" formnovalidate class="secondary-button">取消</button><button type="submit" value="default" class="primary-button">保存课程</button></div></form></dialog>
<dialog id="settingsDialog" class="dialog"><form method="dialog" id="settingsForm"><div class="dialog-header"><h2>课表设置</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><label>课表名称<input name="name" required maxlength="30"></label><div class="two-columns"><label>第一周周一<input name="firstDay" type="date" required></label><label>学期周数<input name="termWeeks" type="number" min="1" max="60" required></label></div><label class="switch-row"><span><strong>显示周六、周日</strong><small>导入的周末课程也会正常显示</small></span><input name="showWeekend" type="checkbox"></label><label class="switch-row"><span><strong>显示非本周课程</strong><small>淡化显示不在当前周的课程</small></span><input name="showOtherWeeks" type="checkbox"></label><label class="switch-row"><span><strong>课前提示</strong><small>应用打开时显示下一节课</small></span><input name="reminder" type="checkbox"></label><details><summary>12 节上课时间</summary><div id="timeEditor" class="time-editor"></div></details><div class="dialog-actions"><button value="cancel" formnovalidate class="secondary-button">取消</button><button type="submit" class="primary-button">保存设置</button></div></form></dialog>
<dialog id="codeDialog" class="dialog"><form method="dialog" id="codeForm"><div class="dialog-header"><h2 id="codeDialogTitle">同步码</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><p id="codeDescription" class="dialog-copy"></p><textarea id="syncCode" rows="8" spellcheck="false"></textarea><div class="dialog-actions"><button type="button" id="copyCodeButton" class="secondary-button">复制</button><button type="submit" id="codeSubmit" class="primary-button">导入副本</button></div></form></dialog>
<dialog id="newBoardDialog" class="dialog small-dialog"><form method="dialog" id="newBoardForm"><div class="dialog-header"><h2>新建课表</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><label>课表名称<input name="name" required maxlength="30" placeholder="如：2026 秋季学期"></label><div class="dialog-actions"><button value="cancel" formnovalidate class="secondary-button">取消</button><button type="submit" class="primary-button">新建</button></div></form></dialog>
<dialog id="coursesDialog" class="dialog small-dialog"><form method="dialog"><div class="dialog-header"><h2>已添加课程</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><div id="courseManagerList" class="manager-list"></div></form></dialog>
<div id="toast" class="toast"></div>
<template id="slotTemplate"><article class="slot-editor"><div class="slot-editor-top"><strong>时段</strong><button type="button" class="remove-slot plain-button">删除</button></div><div class="slot-grid"><label>星期<select class="slot-day"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></label><label>开始节<select class="slot-start"></select></label><label>结束节<select class="slot-end"></select></label></div><div class="two-columns"><label>周次<input class="slot-weeks" required value="1-16" placeholder="如：1-16、3、1,3,5-8"></label><label>本时段地点<input class="slot-location" maxlength="60" placeholder="留空则使用默认地点"></label></div></article></template>
<script>
(() => {
'use strict';
const STORE='kejian-timetable-v1';
const COLORS=['#6b8fbd','#7b78b8','#639a8a','#b8817a','#758ea8','#8b7cab','#6f9678','#a08362','#7189a8','#8b819e'];
const DEFAULT_TIMES=[['08:00','08:45'],['08:55','09:40'],['10:00','10:45'],['10:55','11:40'],['14:00','14:45'],['14:55','15:40'],['16:00','16:45'],['16:55','17:40'],['19:00','19:45'],['19:55','20:40'],['21:00','21:45'],['21:55','22:40']];
const $=s=>document.querySelector(s);
const el={schedule:$('#schedule'),today:$('#todayLabel'),week:$('#weekLabel'),range:$('#weekRange'),now:$('#nowCard'),panel:$('#boardPanel'),scrim:$('#scrim'),boardList:$('#boardList'),htmlInput:$('#htmlFileInput'),toast:$('#toast')};
let state=loadState(); let currentWeek=1; let editingCourseId=null; let codeMode='share';
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function isoDate(d){return new Date(d).toISOString().slice(0,10)}
function defaultBoard(name='我的课表'){return {id:uid(),name,firstDay:isoDate(mondayOf(new Date())),termWeeks:20,showWeekend:true,showOtherWeeks:false,reminder:true,times:DEFAULT_TIMES.map(x=>[...x]),courses:[]}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s?.boards?.length)return s}catch(e){}const b=defaultBoard();return{activeBoardId:b.id,boards:[b]}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function board(){return state.boards.find(b=>b.id===state.activeBoardId)||state.boards[0]}
function toast(msg){el.toast.textContent=msg;el.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove('show'),2200)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function weeksToSet(expr,term=60){const s=new Set();if(!expr)return s;let t=String(expr).replace(/第/g,'').replace(/周/g,'').replace(/[，、；;]/g,',').replace(/[—–~～至]/g,'-').replace(/\s+/g,'');const odd=/单/.test(t),even=/双/.test(t);t=t.replace(/[单双全]/g,'');if(!t&& (odd||even)){for(let i=1;i<=term;i++)if((odd&&i%2===1)||(even&&i%2===0))s.add(i);return s}for(const part of t.split(',').filter(Boolean)){const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)continue;let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];for(let i=a;i<=b&&i<=term;i++){if(odd&&i%2===0)continue;if(even&&i%2===1)continue;s.add(i)}}return s}
function normalizeWeeks(expr){const nums=[...weeksToSet(expr,60)].sort((a,b)=>a-b);if(!nums.length)return String(expr||'').replace(/第|周/g,'').trim();const out=[];let a=nums[0],p=nums[0];for(let i=1;i<=nums.length;i++){const n=nums[i];if(n===p+1){p=n;continue}out.push(a===p?String(a):`${a}-${p}`);a=p=n}return out.join(',')}
function maxWeek(expr){const a=[...weeksToSet(expr,60)];return a.length?Math.max(...a):0}
function parseSections(txt,fallbackStart=1,classNum=1){const m=String(txt||'').match(/(\d+)\s*[-—–~～至]\s*(\d+)\s*节/);if(m)return[+m[1],+m[2]];const n=String(txt||'').match(/(\d+)\s*节/);if(n)return[+n[1],+n[1]];return[fallbackStart,fallbackStart+Math.max(1,+classNum||1)-1]}
function parseUrpHtml(html){const doc=new DOMParser().parseFromString(html,'text/html');const blocks=[...doc.querySelectorAll('#courseTable .class_div')];if(!blocks.length)throw new Error('没有找到 #courseTable .class_div 课程块，请确认上传的是“选课结果”完整 HTML。');const map=new Map();blocks.forEach((block,idx)=>{const td=block.closest('td[id]');const idm=td?.id?.match(/^(\d+)_(\d+)$/);if(!idm)return;const day=+idm[1],fallbackStart=+idm[2];if(day<1||day>7)return;const ps=[...block.children].filter(n=>n.tagName==='P');const gray=ps.filter(p=>p.classList.contains('kcb_p_gray'));const name=(ps.find(p=>[...p.classList].some(c=>c.startsWith('p-kcm-')))||ps[0])?.textContent.trim();if(!name)return;const teacher=(gray[0]?.textContent||'').trim().replace(/\*+$/,'').trim();const weeks=normalizeWeeks(gray[1]?.textContent||'');const sec=gray[2]?.textContent||'';const loc=(ps.find(p=>[...p.classList].some(c=>c.startsWith('p-jxl-')))||ps[4])?.textContent.trim()||'';const [start,end]=parseSections(sec,fallbackStart,block.getAttribute('classnum'));const key=name+'\u0000'+teacher;let c=map.get(key);if(!c){c={id:uid(),name,teacher,location:'',color:COLORS[map.size%COLORS.length],note:'',slots:[]};map.set(key,c)}c.slots.push({id:uid(),day,start,end,weeks:weeks||'1-20',location:loc});});const courses=[...map.values()];for(const c of courses){const locs=[...new Set(c.slots.map(s=>s.location).filter(Boolean))];if(locs.length===1)c.location=locs[0];c.slots=c.slots.filter((s,i,a)=>a.findIndex(x=>x.day===s.day&&x.start===s.start&&x.end===s.end&&x.weeks===s.weeks&&x.location===s.location)===i)}
const times=DEFAULT_TIMES.map(x=>[...x]);for(let i=1;i<=12;i++){const th=doc.getElementById(`0_${i}`);const m=th?.textContent.match(/(\d{2}:\d{2})\s*[-—–~～至]\s*(\d{2}:\d{2})/);if(m)times[i-1]=[m[1],m[2]]}
let currentWeekHint=null;for(const node of doc.querySelectorAll('.span_bbzx')){const m=node.textContent.match(/第\s*(\d+)\s*周/);if(m){currentWeekHint=+m[1];break}}
return{courses,times,currentWeekHint,rawCount:blocks.length}}
function inferFirstDayFromWeek(week){const mon=mondayOf(new Date());mon.setDate(mon.getDate()-(week-1)*7);return isoDate(mon)}
function weekForDate(date,b=board()){const first=new Date(b.firstDay+'T00:00:00');const d=mondayOf(date);return Math.floor((d-first)/604800000)+1}
function dateForDay(week,day,b=board()){const d=new Date(b.firstDay+'T00:00:00');d.setDate(d.getDate()+(week-1)*7+(day-1));return d}
function render(){const b=board();currentWeek=clamp(currentWeek,1,b.termWeeks);el.range.max=b.termWeeks;el.range.value=currentWeek;el.week.textContent=`第 ${currentWeek} 周`;const today=new Date();el.today.textContent=today.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});renderSchedule();renderNow();renderBoards();save()}
function renderSchedule(){const b=board();const days=b.showWeekend?7:5;el.schedule.innerHTML='';el.schedule.style.gridTemplateColumns=`72px repeat(${days},minmax(130px,1fr))`;const corner=document.createElement('div');corner.className='grid-cell head-cell';corner.style.gridColumn='1';corner.style.gridRow='1';corner.textContent='节次';el.schedule.append(corner);for(let d=1;d<=days;d++){const h=document.createElement('div');h.className='grid-cell head-cell';h.style.gridColumn=String(d+1);h.style.gridRow='1';const dt=dateForDay(currentWeek,d);h.textContent=`周${'一二三四五六日'[d-1]} · ${dt.getMonth()+1}/${dt.getDate()}`;const now=new Date();if(dt.getFullYear()===now.getFullYear()&&dt.getMonth()===now.getMonth()&&dt.getDate()===now.getDate()){h.classList.add('today');h.setAttribute('aria-current','date');h.title='今天'}el.schedule.append(h)}for(let s=1;s<=12;s++){const t=document.createElement('div');t.className='grid-cell time-cell';t.style.gridColumn='1';t.style.gridRow=String(s+1);const tm=b.times[s-1]||DEFAULT_TIMES[s-1];t.innerHTML=`<b>${s}</b><span>${tm[0]}</span><span>${tm[1]}</span>`;el.schedule.append(t);for(let d=1;d<=days;d++){const c=document.createElement('div');c.className='grid-cell';c.style.gridColumn=String(d+1);c.style.gridRow=String(s+1);el.schedule.append(c)}}const entries=[];for(const c of b.courses){for(const s of c.slots||[]){if(s.day>days)continue;const active=weeksToSet(s.weeks,b.termWeeks).has(currentWeek);if(active||b.showOtherWeeks)entries.push({course:c,slot:s,active})}}const groups=new Map();for(const e of entries){const k=`${e.slot.day}-${e.slot.start}-${e.slot.end}`;(groups.get(k)||groups.set(k,[]).get(k)).push(e)}for(const e of entries){const g=groups.get(`${e.slot.day}-${e.slot.start}-${e.slot.end}`);const idx=g.indexOf(e),count=g.length;const card=document.createElement('div');card.className='course-card'+(e.active?'':' other-week');card.style.gridColumn=String(e.slot.day+1);card.style.gridRow=`${e.slot.start+1} / span ${Math.max(1,e.slot.end-e.slot.start+1)}`;card.style.background=e.course.color||COLORS[0];card.style.width=`calc(100% / ${count})`;card.style.transform=`translateX(${idx*100}%)`;card.innerHTML=`<div class="course-name">${esc(e.course.name)}</div><div class="course-meta">${esc(e.slot.location||e.course.location||'地点未填')}</div><div class="course-meta">${esc(e.course.teacher||'教师未填')} · ${e.slot.start}-${e.slot.end}节</div><div class="course-weeks">${esc(e.slot.weeks)}周</div>`;card.addEventListener('click',()=>openCourse(e.course.id));el.schedule.append(card)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderNow(){const b=board();const now=new Date();const w=weekForDate(now,b);const day=now.getDay()||7;if(w<1||w>b.termWeeks){el.now.innerHTML='<strong>当前不在本学期范围内</strong><small>可在设置中调整第一周周一。</small>';return}const mins=now.getHours()*60+now.getMinutes();const todays=[];for(const c of b.courses)for(const s of c.slots||[])if(s.day===day&&weeksToSet(s.weeks,b.termWeeks).has(w)){const tm=b.times[s.start-1]||DEFAULT_TIMES[s.start-1];const [h,m]=tm[0].split(':').map(Number);todays.push({c,s,start:h*60+m,tm})}todays.sort((a,b)=>a.start-b.start);const next=todays.find(x=>x.start>=mins-10);if(!next){el.now.innerHTML='<strong>今天没有接下来的课程</strong><small>可以安心安排剩余时间。</small>';return}el.now.innerHTML=`<strong>${next.start<mins?'正在上':'下一节'}：${esc(next.c.name)}</strong><small>${next.tm[0]} · ${esc(next.s.location||next.c.location||'地点未填')} · ${esc(next.s.weeks)}周</small>`}
function openPanel(){el.panel.classList.add('open');el.panel.setAttribute('aria-hidden','false');el.scrim.hidden=false}
function closePanel(){el.panel.classList.remove('open');el.panel.setAttribute('aria-hidden','true');el.scrim.hidden=true}
function renderBoards(){el.boardList.innerHTML='';for(const b of state.boards){const x=document.createElement('div');x.className='board-item'+(b.id===state.activeBoardId?' active':'');x.innerHTML=`<span>${esc(b.name)}</span><small>${b.courses.length} 门</small>`;x.onclick=()=>{state.activeBoardId=b.id;currentWeek=clamp(weekForDate(new Date(),b),1,b.termWeeks);closePanel();render()};el.boardList.append(x)}}
function addSlotEditor(slot={day:1,start:1,end:2,weeks:'1-16',location:''}){const node=$('#slotTemplate').content.firstElementChild.cloneNode(true);const starts=node.querySelector('.slot-start'),ends=node.querySelector('.slot-end');for(let i=1;i<=12;i++){starts.add(new Option(String(i),String(i)));ends.add(new Option(String(i),String(i)))}node.querySelector('.slot-day').value=slot.day;starts.value=slot.start;ends.value=slot.end;node.querySelector('.slot-weeks').value=slot.weeks;node.querySelector('.slot-location').value=slot.location||'';node.querySelector('.remove-slot').onclick=()=>node.remove();$('#slotList').append(node)}
function openCourse(id=null){editingCourseId=id;const form=$('#courseForm');form.reset();$('#slotList').innerHTML='';const c=id?board().courses.find(x=>x.id===id):null;$('#courseDialogTitle').textContent=c?'编辑课程':'添加课程';if(c){form.elements.name.value=c.name;form.elements.teacher.value=c.teacher||'';form.elements.location.value=c.location||'';form.elements.color.value=c.color||COLORS[0];form.elements.note.value=c.note||'';(c.slots||[]).forEach(addSlotEditor)}else addSlotEditor();$('#courseDialog').showModal()}
function collectSlots(){return[...$('#slotList').children].map(n=>({id:uid(),day:+n.querySelector('.slot-day').value,start:+n.querySelector('.slot-start').value,end:+n.querySelector('.slot-end').value,weeks:normalizeWeeks(n.querySelector('.slot-weeks').value),location:n.querySelector('.slot-location').value.trim()})).map(s=>{if(s.end<s.start)[s.start,s.end]=[s.end,s.start];return s})}
function openSettings(){const b=board(),f=$('#settingsForm');f.elements.name.value=b.name;f.elements.firstDay.value=b.firstDay;f.elements.termWeeks.value=b.termWeeks;f.elements.showWeekend.checked=b.showWeekend;f.elements.showOtherWeeks.checked=b.showOtherWeeks;f.elements.reminder.checked=b.reminder;const ed=$('#timeEditor');ed.innerHTML='';b.times.forEach((tm,i)=>{const r=document.createElement('div');r.className='time-row';r.innerHTML=`<b>${i+1}</b><input type="time" data-i="${i}" data-k="0" value="${tm[0]}"><input type="time" data-i="${i}" data-k="1" value="${tm[1]}">`;ed.append(r)});$('#settingsDialog').showModal()}
function renderManager(){const box=$('#courseManagerList');box.innerHTML='';for(const c of board().courses){const row=document.createElement('div');row.className='manager-item';row.innerHTML=`<span class="dot" style="background:${c.color}"></span><div class="info"><b>${esc(c.name)}</b><small>${c.slots.length} 个时段</small></div><button type="button" class="plain-button edit">编辑</button><button type="button" class="plain-button del">删除</button>`;row.querySelector('.edit').onclick=()=>{document.querySelector('#coursesDialog').close();openCourse(c.id)};row.querySelector('.del').onclick=()=>{if(confirm(`删除“${c.name}”？`)){board().courses=board().courses.filter(x=>x.id!==c.id);renderManager();render()}};box.append(row)}if(!board().courses.length)box.innerHTML='<p class="local-note">还没有课程。</p>'}
async function importHtmlFile(file){const html=await file.text();const parsed=parseUrpHtml(html);const b=board();if(b.courses.length){const replace=confirm(`解析到 ${parsed.courses.length} 门课程、${parsed.rawCount} 个上课时段。\n\n确定：覆盖当前课程\n取消：追加导入`);if(replace)b.courses=[]}const existingKeys=new Set(b.courses.map(c=>c.name+'\u0000'+c.teacher));for(const c of parsed.courses){const key=c.name+'\u0000'+c.teacher;if(!existingKeys.has(key)){b.courses.push(c);existingKeys.add(key)}else{const old=b.courses.find(x=>x.name+'\u0000'+x.teacher===key);for(const s of c.slots){if(!old.slots.some(x=>x.day===s.day&&x.start===s.start&&x.end===s.end&&x.weeks===s.weeks&&x.location===s.location))old.slots.push(s)}}}b.times=parsed.times;const mw=Math.max(1,...b.courses.flatMap(c=>c.slots.map(s=>maxWeek(s.weeks))));b.termWeeks=Math.max(b.termWeeks,mw);if(parsed.currentWeekHint)b.firstDay=inferFirstDayFromWeek(parsed.currentWeekHint);currentWeek=clamp(parsed.currentWeekHint||weekForDate(new Date(),b),1,b.termWeeks);save();closePanel();render();toast(`导入完成：${parsed.courses.length} 门课程，周次已按原页面保存`) }
function b64enc(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}
function b64dec(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
$('#boardMenuButton').onclick=openPanel;$('#closePanel').onclick=closePanel;el.scrim.onclick=closePanel;$('#importHtmlButton').onclick=()=>el.htmlInput.click();el.htmlInput.onchange=async()=>{const f=el.htmlInput.files?.[0];if(!f)return;try{await importHtmlFile(f)}catch(e){alert('导入失败：'+e.message)}finally{el.htmlInput.value=''}};
$('#previousWeek').onclick=()=>{currentWeek--;render()};$('#nextWeek').onclick=()=>{currentWeek++;render()};el.range.oninput=()=>{currentWeek=+el.range.value;render()};$('#jumpToday').onclick=()=>{currentWeek=clamp(weekForDate(new Date()),1,board().termWeeks);render()};$('#changeWeek').onclick=()=>{const b=board();const n=+prompt('把今天设为第几周？',String(weekForDate(new Date(),b)));if(n>=1&&n<=b.termWeeks){b.firstDay=inferFirstDayFromWeek(n);currentWeek=n;render()}};
$('#addCourseButton').onclick=()=>openCourse();$('#addSlotButton').onclick=()=>addSlotEditor();$('#courseForm').addEventListener('submit',e=>{if(e.submitter?.value==='cancel')return;const f=e.currentTarget,slots=collectSlots();if(!slots.length){e.preventDefault();alert('至少添加一个时段');return}const c={id:editingCourseId||uid(),name:f.elements.name.value.trim(),teacher:f.elements.teacher.value.trim(),location:f.elements.location.value.trim(),color:f.elements.color.value,note:f.elements.note.value.trim(),slots};const b=board();if(editingCourseId)b.courses=b.courses.map(x=>x.id===editingCourseId?c:x);else b.courses.push(c);save();setTimeout(render,0)});
$('#settingsButton').onclick=openSettings;$('#settingsForm').addEventListener('submit',e=>{const f=e.currentTarget,b=board();b.name=f.elements.name.value.trim();b.firstDay=f.elements.firstDay.value;b.termWeeks=clamp(+f.elements.termWeeks.value,1,60);b.showWeekend=f.elements.showWeekend.checked;b.showOtherWeeks=f.elements.showOtherWeeks.checked;b.reminder=f.elements.reminder.checked;document.querySelectorAll('#timeEditor input').forEach(inp=>{b.times[+inp.dataset.i][+inp.dataset.k]=inp.value});currentWeek=clamp(currentWeek,1,b.termWeeks);save();setTimeout(render,0)});
$('#manageCoursesButton').onclick=()=>{renderManager();closePanel();$('#coursesDialog').showModal()};
$('#newBoardButton').onclick=()=>{closePanel();$('#newBoardDialog').showModal()};$('#newBoardForm').addEventListener('submit',e=>{const n=e.currentTarget.elements.name.value.trim();if(!n)return;const b=defaultBoard(n);state.boards.push(b);state.activeBoardId=b.id;currentWeek=1;save();setTimeout(render,0)});
$('#shareBoardButton').onclick=()=>{codeMode='share';$('#codeDialogTitle').textContent='同步码';$('#codeDescription').textContent='复制此同步码，可在另一台设备导入为独立副本。';$('#syncCode').value=b64enc({version:1,board:board()});$('#codeSubmit').style.display='none';$('#copyCodeButton').style.display='inline-block';closePanel();$('#codeDialog').showModal()};
$('#importCodeButton').onclick=()=>{codeMode='import';$('#codeDialogTitle').textContent='导入同步码';$('#codeDescription').textContent='粘贴同步码后导入为新的独立课表。';$('#syncCode').value='';$('#codeSubmit').style.display='inline-block';$('#copyCodeButton').style.display='none';closePanel();$('#codeDialog').showModal()};
$('#copyCodeButton').onclick=async()=>{const text=$('#syncCode').value;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{$('#syncCode').focus();$('#syncCode').select();document.execCommand('copy')}toast('同步码已复制')}catch(e){alert('复制失败，请手动复制同步码')}};$('#codeForm').addEventListener('submit',e=>{if(codeMode!=='import')return;try{const obj=b64dec($('#syncCode').value);if(!obj?.board)throw new Error('格式错误');const b=JSON.parse(JSON.stringify(obj.board));b.id=uid();b.name=(b.name||'导入课表')+' 副本';state.boards.push(b);state.activeBoardId=b.id;currentWeek=1;save();setTimeout(render,0)}catch(err){e.preventDefault();alert('同步码无效：'+err.message)}});
currentWeek=clamp(weekForDate(new Date()),1,board().termWeeks);render();
})();
</script>

  });
