<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#eaf0fb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="课间" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
<title>课间 · 课程表 v7</title>
</head>
<body>
<main class="app-shell">
<header class="topbar"><button class="icon-button" id="boardMenuButton" aria-label="切换课表">☰</button><div class="date-heading"><strong id="todayLabel">—</strong><span id="weekLabel">第 1 周</span></div><div class="top-actions"><button class="icon-button" id="jumpToday" title="切换白天/夜晚主题" aria-label="切换白天/夜晚主题">☀️</button><button class="icon-button" id="addCourseButton" title="添加课程">＋</button><button class="icon-button" id="settingsButton" title="课表设置">⚙</button></div></header>
<section class="now-card" id="nowCard"></section>
<section class="week-controls"><button id="previousWeek" class="week-button">‹</button><input id="weekRange" type="range" min="1" max="20" value="1"><button id="nextWeek" class="week-button">›</button><button id="changeWeek" class="week-text-button">修改当前周</button></section>
<section class="schedule-frame"><div class="schedule" id="schedule"></div></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="board-panel" id="boardPanel" aria-hidden="true">
<div class="panel-heading"><span>我的课表</span><button class="plain-button" id="closePanel">关闭</button></div>
<div id="boardList" class="board-list"></div>
<button class="wide-action primary" id="newBoardButton"><span class="side-action-content"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>新建课表</span></span></button>
<button class="wide-action" id="renameBoardButton">重命名课表</button>
<button class="wide-action" id="deleteBoardButton" style="color:#b42318;border-color:#efb7b1;background:#fff7f6"><span class="side-action-content"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 10v6M14 10v6"/></svg><span>删除此课表</span></span></button>
<button class="wide-action" id="manageCoursesButton">管理已添加课程</button>
<div class="panel-section">数据</div>
<button class="wide-action" id="importHtmlButton">从教务系统 HTML 导入</button>
<button class="wide-action" id="shareBoardButton">生成同步码</button>
<button class="wide-action" id="importCodeButton">导入同步码</button>
<div class="panel-section">个性化</div>
<button class="wide-action" id="backgroundImageButton">更换课表背景</button>
<button class="wide-action" id="clearBackgroundButton">清除课表背景</button>
<button class="wide-action" id="homeIconButton">更换手机桌面图标</button>
<button class="wide-action" id="resetHomeIconButton">恢复默认桌面图标</button>
<div class="panel-section">关于 · v7</div>
<p class="local-note"><strong>网站负责提供程序，课表数据只留在用户自己的设备里。</strong><br>支持烟台大学 URP 教务系统、杭州医学院正方教务系统。<br>第一周周一默认为 2026/8/31。18:00–次日 6:00 自动切换暗色主题。</p>
</aside>
<input type="file" id="htmlFileInput" accept="text/html,.html,.htm" hidden>
<input type="file" id="backgroundFileInput" accept="image/*" hidden>
<input type="file" id="homeIconFileInput" accept="image/*" hidden>
<dialog id="courseDialog" class="dialog"><form method="dialog" id="courseForm"><div class="dialog-header"><h2 id="courseDialogTitle">添加课程</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><label>课程名称<input name="name" required maxlength="60"></label><div class="two-columns"><label>教师<input name="teacher" maxlength="40"></label><label>默认地点<input name="location" maxlength="60" placeholder="各时段可单独设置"></label></div><label>课程颜色<input class="color-input" name="color" type="color" value="#6f8fbd"></label><div class="slot-title"><span>上课时间</span><button type="button" class="plain-button" id="addSlotButton">＋ 添加时段</button></div><div id="slotList" class="slot-list"></div><label>备注<textarea name="note" rows="2" maxlength="160"></textarea></label><div class="dialog-actions"><button value="cancel" formnovalidate class="secondary-button">取消</button><button type="submit" value="default" class="primary-button">保存课程</button></div></form></dialog>
<dialog id="settingsDialog" class="dialog"><form method="dialog" id="settingsForm"><div class="dialog-header"><h2>课表设置</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><label>课表名称<input name="name" required maxlength="30"></label><div class="two-columns"><label>第一周周一<input name="firstDay" type="date" required></label><label>学期周数<input name="termWeeks" type="number" min="1" max="60" required></label></div><label class="switch-row"><span><strong>显示周六、周日</strong><small>导入的周末课程也会正常显示</small></span><input name="showWeekend" type="checkbox"></label><label class="switch-row"><span><strong>显示非本周课程</strong><small>非本周课程以 50% 透明度显示</small></span><input name="showOtherWeeks" type="checkbox"></label><label class="switch-row"><span><strong>课前提示</strong><small>应用打开时显示下一节课</small></span><input name="reminder" type="checkbox"></label><details><summary>上课时间</summary><div id="timeEditor" class="time-editor"></div><button type="button" class="wide-action" id="addSectionButton">＋ 添加一节</button></details><div class="dialog-actions"><button value="cancel" formnovalidate class="secondary-button">取消</button><button type="submit" class="primary-button">保存设置</button></div></form></dialog>
<dialog id="codeDialog" class="dialog"><form method="dialog" id="codeForm"><div class="dialog-header"><h2 id="codeDialogTitle">同步码</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><p id="codeDescription" class="dialog-copy"></p><textarea id="syncCode" rows="8" spellcheck="false"></textarea><div class="dialog-actions"><button type="button" id="copyCodeButton" class="secondary-button">复制</button><button type="submit" id="codeSubmit" class="primary-button">导入副本</button></div></form></dialog>
<dialog id="newBoardDialog" class="dialog small-dialog"><form method="dialog" id="newBoardForm"><div class="dialog-header"><h2>新建课表</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><label>课表名称<input name="name" required maxlength="30" placeholder="如：2026 秋季学期"></label><div class="dialog-actions"><button value="cancel" formnovalidate class="secondary-button">取消</button><button type="submit" class="primary-button">新建</button></div></form></dialog>
<dialog id="coursesDialog" class="dialog small-dialog"><form method="dialog"><div class="dialog-header"><h2>已添加课程</h2><button value="cancel" formnovalidate class="icon-button">×</button></div><div id="courseManagerList" class="manager-list"></div></form></dialog>
<div id="toast" class="toast"></div>
<template id="slotTemplate"><article class="slot-editor"><div class="slot-editor-top"><strong>时段</strong><button type="button" class="remove-slot plain-button">删除</button></div><div class="slot-grid"><label>星期<select class="slot-day"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></label><label>开始节<select class="slot-start"></select></label><label>结束节<select class="slot-end"></select></label></div><div class="two-columns"><label>周次<input class="slot-weeks" required value="1-16" placeholder="如：1-16、3、1,3,5-8"></label><label>本时段地点<input class="slot-location" maxlength="60" placeholder="留空则使用默认地点"></label></div><label>本时段教师<input class="slot-teacher" maxlength="60" placeholder="留空则使用默认教师"></label></article></template>
<script src="importers.js"></script>
<script src="appearance.js"></script>
<script src="app.js"></script>
<script src="v5.js"></script>
<script src="v6.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker 注册失败：', err));
  });
}
</script>
</body>
</html>
